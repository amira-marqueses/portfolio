<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250" fill="none">
  <defs>
    <linearGradient id="bowFill" x1="40" y1="20" x2="200" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e4deef"/>
      <stop offset="0.45" stop-color="#c8bfe7"/>
      <stop offset="1" stop-color="#b3a5d1"/>
    </linearGradient>
    <linearGradient id="bowDeep" x1="90" y1="70" x2="150" y2="130" gradientUnits="userSpaceOnUse">
